# nginx site: erp.polymateproducts.com (หลัง Cloudflare, SSL mode Flexible → origin รับ HTTP :80)
# ติดตั้งเป็น /etc/nginx/sites-available/polymateproducts-erp แล้ว symlink เข้า sites-enabled
# (ชื่อไฟล์ต้องเรียงหลัง "polymateproducts" เพื่อไม่ให้กลายเป็น default server ของเว็บหลัก)
server {
    listen 80;
    listen [::]:80;
    server_name erp.polymateproducts.com;

    root /var/www/erp;
    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;

    # API → Spring Boot (container, host network)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        # IP จริงของผู้ใช้จาก Cloudflare (ใช้ใน rate limit และ audit log)
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # หน้าเว็บ: เปิดให้เฉพาะไฟล์ที่จำเป็น (เหมือน allow-list ใน server.mjs)
    location = / {
        try_files /index.html =404;
    }
    location ~ ^/(index\.html|styles\.css|[A-Za-z0-9._-]+\.jsx)$ {
        types { text/html html; text/css css; text/babel jsx; }
        try_files $uri =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # อย่างอื่นทั้งหมด (docs/, erp/, .env, server.mjs, ...) ไม่ให้เข้าถึง
    location / {
        return 404;
    }
}
