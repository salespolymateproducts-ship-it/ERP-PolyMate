spring.application.name=erp
server.port=${PORT:8080}

# ---- Database (PostgreSQL บน EC2) : ตั้งค่าผ่าน environment variable เท่านั้น ห้าม commit รหัสผ่าน ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erp}
spring.datasource.username=${DB_USERNAME:erp_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

# ---- App ----
erp.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8765}
erp.session.hours=${SESSION_HOURS:12}
# รหัสผ่านเริ่มต้นของ admin ครั้งแรก (ถ้าไม่ตั้ง ระบบสุ่มและพิมพ์ใน log ครั้งเดียว) — ต้องเปลี่ยนเมื่อเข้าสู่ระบบครั้งแรก
erp.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}

spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
server.shutdown=graceful
