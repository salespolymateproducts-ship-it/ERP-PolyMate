<body>
  <div id="root"><div id="erp-boot" style="position:fixed;inset:0;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#5B6478;background:#EEF2F6">กำลังโหลด PolyMate ERP…</div></div>
  <noscript><div style="padding:24px;font-family:system-ui,sans-serif">PolyMate ERP ต้องเปิด JavaScript ในเบราว์เซอร์</div></noscript>

  <!-- Boot guard: แจ้งเตือนเมื่อเปิดผ่าน file:// หรือโหลดไฟล์ไม่สำเร็จ (แทนหน้าจอว่าง) -->
  <script>
    (function () {
      var errors = [];
      function show(title, detail) {
        var root = document.getElementById("root");
        if (!root || window.__erpMounted) return;
        root.innerHTML = "";
        var box = document.createElement("div");
        box.style.cssText = "max-width:640px;margin:10vh auto;padding:24px 28px;background:#fff;border:1px solid #F3C2C2;border-left:5px solid #DC2626;border-radius:12px;font-family:system-ui,sans-serif;color:#0F172A;line-height:1.6";
        var h = document.createElement("div"); h.style.cssText = "font-weight:700;font-size:17px;margin-bottom:8px"; h.textContent = title;
        var p = document.createElement("div"); p.style.cssText = "font-size:13.5px;white-space:pre-wrap"; p.textContent = detail;
        var b = document.createElement("button"); b.textContent = "ลองโหลดใหม่"; b.style.cssText = "margin-top:14px;padding:7px 16px;border-radius:8px;border:1px solid #2D6CDF;background:#2D6CDF;color:#fff;cursor:pointer";
        b.onclick = function () { location.reload(); };
        box.appendChild(h); box.appendChild(p); box.appendChild(b); root.appendChild(box);
      }
      window.__erpBootError = show;
      if (location.protocol === "file:") {
        show("ต้องเปิดผ่าน Web Server", "ระบบโหลดไฟล์ .jsx ด้วย HTTP จึงเปิดโดยดับเบิลคลิกไฟล์ (file://) ไม่ได้\nทดสอบในเครื่อง: powershell -ExecutionPolicy Bypass -File serve.ps1 แล้วเปิด http://localhost:8765/\nใช้งานจริง: อัปโหลดทั้งโฟลเดอร์ขึ้น Web Hosting แล้วเปิด index.html");
        window.__erpMounted = true; // หยุด watchdog
        return;
      }
      // ระบบ Login ใช้ crypto.subtle (SHA-256) ซึ่งเบราว์เซอร์เปิดให้เฉพาะ HTTPS หรือ localhost
      if (!window.isSecureContext || !(window.crypto && window.crypto.subtle)) {
        show("ต้องเปิดผ่าน HTTPS", "เบราว์เซอร์ปิดการเข้ารหัสรหัสผ่าน (Web Crypto) บนการเชื่อมต่อ http:// ที่ไม่ใช่ localhost จึงเข้าสู่ระบบไม่ได้\nกรุณาเปิดผ่าน https:// (ติดตั้ง SSL Certificate บน Hosting)");
        window.__erpMounted = true; window.__erpBlocked = true;
        return;
      }
      // ไฟล์ CSS/JS/รูปที่โหลดไม่สำเร็จ (404 / เครือข่าย / CDN ล่ม)
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) {
          errors.push("โหลดไม่สำเร็จ: " + (t.src || t.href));
          if (t.tagName === "SCRIPT") show("โหลดไฟล์ระบบไม่สำเร็จ", errors.join("\n") + "\n\nตรวจสอบการเชื่อมต่ออินเทอร์เน็ต (React/Babel โหลดจาก CDN) หรือว่าไฟล์ถูกอัปโหลดครบ");
        } else if (e.message && !window.__erpMounted) {
          errors.push(e.message);
          if (/Could not load/i.test(e.message)) show("โหลดไฟล์ระบบไม่สำเร็จ", errors.join("\n") + "\n\nตรวจสอบว่าไฟล์ .jsx ถูกอัปโหลดครบและชื่อไฟล์ตรงกัน (Web Server บางตัวแยกตัวพิมพ์เล็ก-ใหญ่)");
        }
      }, true);
      // ถ้าเกิน 25 วินาทียังไม่แสดงหน้าระบบ → แสดงสาเหตุที่พบ
      setTimeout(function () {
        if (!window.__erpMounted) show("ระบบเริ่มทำงานไม่สำเร็จ", (errors.length ? errors.join("\n") : "ไม่พบข้อผิดพลาดที่ระบุได้ — อาจโหลดช้าหรือไฟล์บางส่วนหายไป") + "\n\nเปิด Developer Console (F12) เพื่อดูรายละเอียด");
      }, 25000);
    })();
  </script>
